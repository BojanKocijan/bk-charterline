name: Commercial license inquiry
description: Ask about using Design Forge under a commercial license instead of GPL-3.0
title: "commercial license: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. Read [COMMERCIAL.md](https://github.com/BojanKocijan/design-forge/blob/main/COMMERCIAL.md) first: many companies don't need a commercial license at all.

        **This issue is public. Don't include confidential details.** Once I reply, we can continue privately.

  - type: input
    id: company
    attributes:
      label: Company
      placeholder: e.g., Acme Corp
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: What do you want to do with Design Forge?
      description: For example, ship a changed version to customers, or build its skills into a product. Why doesn't GPL-3.0 fit?
    validations:
      required: true

  - type: dropdown
    id: team-size
    attributes:
      label: Team size using it
      options:
        - "1–10"
        - "11–50"
        - "51–250"
        - "More than 250"
    validations:
      required: true

  - type: input
    id: timeline
    attributes:
      label: Timeline
      placeholder: e.g., this quarter
    validations:
      required: false
