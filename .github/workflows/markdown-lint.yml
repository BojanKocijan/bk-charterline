name: Markdown Lint

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels its older run, so fewer jobs wait
# for a runner. Runs on main are never cancelled: each merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.json
          globs: "**/*.md"
      # What every session pays to load the rules (#188). It warns when
      # CLAUDE.md + CLAUDE_LAWS.md pass the budget and never fails the build.
      - name: Rules token budget
        run: python3 scripts/laws_cost.py --budget 30000
