# Design Forge — Project Registry (EXAMPLE)
#
# Copy this file to `projects.yaml` (gitignored) and let Claude register your
# projects here. Each project gets a locked localhost port so multiple projects
# never clash when you run `npm run dev` in parallel.
#
# Claude auto-registers a new project on first session detection (Law 20):
#   it adds the entry here with the next free port. No PR — this file is local.
#
# Format:
#   - name: project-name
#     repo: owner/repo
#     port: 5173
#     description: one-line description
#     deployment: netlify | github-pages | none
#     status: active | paused | archived

# Global settings. Claude asks on first session and fills this in (Law 1).
settings: {}
  # language: english-only   # or: any — reply in whatever language you write in

# Next available port: 5173

projects: []
  # Example entry (delete this comment block and add your own):
  # - name: my-dashboard
  #   repo: yourname/my-dashboard
  #   port: 5173
  #   description: Internal analytics dashboard
  #   deployment: netlify
  #   status: active
